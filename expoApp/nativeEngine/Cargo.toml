[package]
name = "onDeviceLocationEngine"
version = "1.0.0"
edition = "2024"

[lib]
path = "src/locationEngine.rs"
crate-type = ["staticlib", "rlib"]

[dependencies]
idevice = { git = "https://github.com/jkcoxson/idevice.git", rev = "c65dfbf17b888c5795f17ea3e3dad60e6737252c", default-features = false, features = ["ring", "tcp", "core_device_proxy", "tunnel_tcp_stack", "rsd", "dvt", "heartbeat", "mobile_image_mounter", "tss"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1.8"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"

