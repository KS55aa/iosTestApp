name: Build iOS IPA

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app

      - name: Build Application Bundle
        run: |
          cd iosApp
          xcodebuild -project testApp.xcodeproj \
            -scheme testApp \
            -sdk iphoneos \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_LDFLAGS="-Xlinker -headerpad_max_install_names" \
            CONFIGURATION_BUILD_DIR=build \
            clean build

      - name: Apply Ad-Hoc Signature
        run: |
          cd iosApp
          codesign --force --deep --sign - build/testApp.app
          codesign -dvvv build/testApp.app

      - name: Package IPA Archive
        run: |
          cd iosApp
          mkdir -p Payload
          cp -r build/testApp.app Payload/
          zip -r testApp.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: testApp-ipa
          path: iosApp/testApp.ipa
          retention-days: 7
