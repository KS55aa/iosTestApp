name: Build Expo iOS IPA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: expoApp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select Xcode 16
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select --switch /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select --switch /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select --switch /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select --switch /Applications/Xcode_16.app
          else
            sudo xcode-select --switch /Applications/Xcode.app
          fi

      - name: Install Dependencies
        run: npm ci

      - name: Test TypeScript Services
        run: |
          npm run typecheck
          npm test

      - name: Build and Test Native Engine
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
          npm run buildNativeEngine

      - name: Prebuild Native iOS Project
        run: npx expo prebuild --platform ios --clean

      - name: Build Application
        working-directory: expoApp/ios
        run: |
          set -euo pipefail
          workspaces=(*.xcworkspace)
          test "${#workspaces[@]}" -eq 1
          workspaceName="${workspaces[0]}"
          schemeName="${workspaceName%.xcworkspace}"
          xcodebuild -workspace "$workspaceName" \
            -scheme "$schemeName" \
            -sdk iphoneos \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA for Sideload Signing
        working-directory: expoApp/ios
        run: |
          set -euo pipefail
          apps=(build/Build/Products/Release-iphoneos/*.app)
          test "${#apps[@]}" -eq 1
          appPath="${apps[0]}"
          test -d "$appPath"
          codesign --force --deep --sign - "$appPath"
          mkdir -p Payload
          cp -R "$appPath" Payload/
          zip -q -r expoApp.ipa Payload
          shasum -a 256 expoApp.ipa > expoAppChecksum.txt

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: expoApp-ipa
          path: |
            expoApp/ios/expoApp.ipa
            expoApp/ios/expoAppChecksum.txt
          retention-days: 7
